name: Publish Chrome Web Store

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PULSE_BACKEND_URL: ${{ vars.PULSE_BACKEND_URL }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs
        shell: bash
        env:
          PULSE_BACKEND_URL: ${{ vars.PULSE_BACKEND_URL }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: |
          test -n "${PULSE_BACKEND_URL}" || { echo "Set the PULSE_BACKEND_URL repository variable." >&2; exit 1; }
          test -n "${CWS_SERVICE_ACCOUNT_JSON}" || { echo "Set the CWS_SERVICE_ACCOUNT_JSON secret." >&2; exit 1; }
          test -n "${CWS_PUBLISHER_ID}" || { echo "Set the CWS_PUBLISHER_ID secret." >&2; exit 1; }
          test -n "${CWS_ITEM_ID}" || { echo "Set the CWS_ITEM_ID secret." >&2; exit 1; }

      - name: Prepare package
        shell: bash
        run: |
          rm -rf /tmp/chrome-webstore-package /tmp/chrome-webstore-package.zip
          mkdir -p /tmp/chrome-webstore-package
          rsync -a --prune-empty-dirs \
            --include '*/' \
            --include '*.js' \
            --include '*.json' \
            --include '*.html' \
            --include '*.css' \
            --include '*.png' \
            --exclude '*' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'README.md' \
            --exclude 'AGENT_HANDOFF.md' \
            --exclude '.gitignore' \
            --exclude 'chrome-webstore-package.zip' \
            ./ /tmp/chrome-webstore-package/

          export COMMIT_COUNT="$(git rev-list --count HEAD)"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = Path('/tmp/chrome-webstore-package/manifest.json')
          data = json.loads(manifest.read_text())
          parts = data.get('version', '1.0.0').split('.')
          base = parts[:2] if len(parts) >= 2 else ['1', '0']
          data['version'] = '.'.join(base + [os.environ['COMMIT_COUNT']])
          data.pop('update_url', None)
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          PY
          (cd /tmp/chrome-webstore-package && zip -qr /tmp/chrome-webstore-package.zip .)

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-build
          name: Main build
          prerelease: true
          generate_release_notes: false
          files: /tmp/chrome-webstore-package.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Google auth library
        shell: bash
        run: python3 -m pip install --user google-auth requests

      - name: Generate Chrome Web Store access token
        id: google-token
        shell: bash
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["CWS_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/chromewebstore"],
          )
          credentials.refresh(Request())
          print(f"access_token={credentials.token}")
          PY

      - name: Upload package to Chrome Web Store
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google-token.outputs.access_token }}
        run: |
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -T /tmp/chrome-webstore-package.zip "https://chromewebstore.googleapis.com/upload/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_ITEM_ID}:upload"

      - name: Publish item
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google-token.outputs.access_token }}
        run: |
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_ITEM_ID}:publish"
